[workspace]
members = ["apps/desktop/src-tauri", "crates/collaboration-core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.95"

[workspace.dependencies]
hex = "=0.4.3"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["full"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
